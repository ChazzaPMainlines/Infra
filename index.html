<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foaklore | Industrializing Infrastructure Execution</title>
    
    <!-- CDNs for Rapid Deployment -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style type="text/tailwindcss">
        @layer base {
            body { @apply font-sans antialiased bg-white text-slate-900; }
            h1, h2, h3 { @apply tracking-tight font-bold text-slate-900; }
        }
        .glass-card {
            @apply bg-white/40 backdrop-blur-md border border-white/40 shadow-sm transition-all duration-300;
        }
        .glass-card:hover {
            @apply shadow-xl -translate-y-1 border-indigo-200/50;
        }
        .blueprint-gradient {
            background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(248,250,252,1) 100%);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Custom Icon Wrapper for Lucide
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { lucide.createIcons(); }, []);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const Navbar = () => (
            <nav className="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-100">
                <div className="max-w-7xl mx-auto px-6 flex justify-between h-20 items-center">
                    <div className="flex items-center gap-2">
                        <div className="w-8 h-8 bg-indigo-900 rounded-lg flex items-center justify-center">
                            <span className="text-white font-bold text-lg italic">F</span>
                        </div>
                        <span className="text-2xl font-bold tracking-tighter">Foaklore</span>
                    </div>
                    <div className="hidden md:flex items-center space-x-10 text-sm font-semibold text-slate-600">
                        <a href="#solutions" className="hover:text-indigo-900">Solutions</a>
                        <a href="#pillars" className="hover:text-indigo-900">The 7 Pillars</a>
                        <button className="bg-indigo-900 text-white px-6 py-2.5 rounded-full hover:bg-slate-800 transition-all shadow-lg shadow-indigo-900/20">
                            Book Demo
                        </button>
                    </div>
                </div>
            </nav>
        );

        const Hero = () => (
            <section className="pt-48 pb-20 px-6 bg-white relative overflow-hidden">
                <div className="max-w-7xl mx-auto flex flex-col items-center text-center relative z-10">
                    <div className="inline-flex items-center gap-2 bg-slate-50 text-slate-500 px-4 py-1.5 rounded-full text-xs font-bold mb-8 border border-slate-200 uppercase tracking-widest">
                        <Icon name="shield" size={12} /> Institutional Grade Due Diligence
                    </div>
                    <h1 className="text-5xl md:text-7xl mb-8 leading-[1.05]">
                        Industrializing the <br/>
                        <span className="text-indigo-900">Infrastructure Execution Gap.</span>
                    </h1>
                    <p className="text-xl text-slate-500 mb-12 max-w-2xl leading-relaxed">
                        Automated due diligence and live covenant monitoring for mid-market project finance. 
                        Bridge the gap between VDR complexity and Investment Committee certainty.
                    </p>
                    <div className="flex flex-col sm:flex-row gap-4">
                        <button className="bg-indigo-900 text-white px-10 py-4 rounded-xl font-bold text-lg hover:bg-slate-800 transition-all flex items-center gap-3">
                            Join the Platform <Icon name="arrow-right" />
                        </button>
                        <button className="bg-white border border-slate-200 px-10 py-4 rounded-xl font-bold text-lg hover:border-slate-400">
                            View Methodology
                        </button>
                    </div>
                </div>
                {/* Visual Accent */}
                <div className="absolute bottom-0 left-0 w-full h-64 blueprint-gradient -z-0"></div>
            </section>
        );

        const Pillars = () => {
            const data = [
                {
                    title: "Legal & Regulatory",
                    icon: "scale",
                    copy: "Automated cross-referencing of Constitutive Documents, Land Rights, and Material Project Contracts (EPC, O&M, Concession). We instantly red-flag 'Change of Control' clauses, liability caps, and permitting gaps.",
                    img: "https://files.oaiusercontent.com/file-75V0u2u6XgI6Aom1K1v0SjW2?se=2024-10-24T14%3A58%3A18Z&sp=r&sv=2024-08-04&sr=b&rscc=max-age%3D604800%2C%20immutable%2C%20private&rscd=attachment%3B%20filename%3D172f3273-9878-4354-944a-d830b8098ca3.webp&sig=G0%2BMz703B8nJz0wM/9kE7Uv8yvF%2BaA8T4HhI9eLsh5Y%3D"
                },
                {
                    title: "Technical DD",
                    icon: "settings",
                    copy: "Triangulation of IE reports against Feasibility Studies and OEM warranties. The AI validates performance guarantees and availability assumptions against historical degradation curves.",
                    img: "https://files.oaiusercontent.com/file-SgC9Xg40Sg69mXm0Xm69Xm69?se=2024-10-24T14%3A58%3A18Z&sp=r&sv=2024-08-04&sr=b&rscc=max-age%3D604800%2C%20immutable%2C%20private&rscd=attachment%3B%20filename%3Doffshore-windfarm.png&sig=SgC9Xg40Sg69mXm0Xm69Xm69"
                },
                {
                    title: "Financial DD",
                    icon: "trending-up",
                    copy: "Extraction of hard-coded data from Financial Models to stress-test sensitivities. We automate validation of historical Audited Financials against projected Cash Flow Waterfalls and DSCR targets.",
                    img: "https://files.oaiusercontent.com/file-SgC9Xg40Sg69mXm0Xm69Xm69?se=2024-10-24T14%3A58%3A18Z&sp=r&sv=2024-08-04&sr=b&rscc=max-age%3D604800%2C%20immutable%2C%20private&rscd=attachment%3B%20filename%3Denergy-storage.png&sig=SgC9Xg40Sg69mXm0Xm69Xm69"
                },
                {
                    title: "Commercial & Market",
                    icon: "briefcase",
                    copy: "Deep semantic analysis of Revenue Contracts (PPA, Tolling, Lease Agreements). The platform identifies off-taker credit risks, curtailment clauses, and termination rights to quantify revenue security."
                },
                {
                    title: "Insurance",
                    icon: "shield-check",
                    copy: "Reviewing Policy Wordings against LIA requirements. We confirm adequacy of Delay in Start-Up (DSU) indemnity periods and Construction All Risks (CAR) coverage relative to the critical path."
                },
                {
                    title: "ESG Compliance",
                    icon: "leaf",
                    copy: "Auditing ESIA reports against Equator Principles and IFC Performance Standards. Rapid supply chain mapping to flag modern slavery risks or conflict mineral exposure in FOAK technologies."
                },
                {
                    title: "Tax & Accounting",
                    icon: "landmark",
                    copy: "Validating structuring assumptions against local tax jurisdictions. Confirmation of eligibility criteria for Investment Tax Credits (ITC/PTC) to ensure projected equity returns remain intact."
                }
            ];

            return (
                <section id="pillars" className="py-24 px-6 bg-slate-50">
                    <div className="max-w-7xl mx-auto">
                        <div className="mb-16">
                            <h2 className="text-4xl mb-4 italic">The 7 Pillars of Foaklore</h2>
                            <p className="text-slate-500 font-medium max-w-xl">Standardizing rigor across the capital stack. From raw technical data to executive memo.</p>
                        </div>
                        
                        <div className="grid grid-cols-1 md:grid-cols-12 gap-6">
                            {/* Feature Card: Pillar 1 (Legal) - Wide */}
                            <div className="md:col-span-8 glass-card rounded-[2rem] overflow-hidden flex flex-col md:flex-row">
                                <div className="p-10 flex-1">
                                    <div className="text-indigo-900 mb-6"><Icon name={data[0].icon} size={32} /></div>
                                    <h3 className="text-2xl mb-4">{data[0].title}</h3>
                                    <p className="text-slate-600 leading-relaxed text-sm md:text-base">{data[0].copy}</p>
                                </div>
                                <div className="md:w-1/2 bg-slate-200 h-64 md:h-auto overflow-hidden">
                                    <img src={data[0].img} className="w-full h-full object-cover opacity-80 mix-blend-multiply" alt="Solar Farm Blueprint" />
                                </div>
                            </div>

                            {/* Pillar 2 & 3 - Vertical Stack */}
                            <div className="md:col-span-4 flex flex-col gap-6">
                                <div className="glass-card rounded-[2rem] p-8 flex-1">
                                    <div className="text-indigo-900 mb-4"><Icon name={data[1].icon} size={24} /></div>
                                    <h3 className="text-xl mb-2">{data[1].title}</h3>
                                    <p className="text-slate-500 text-xs leading-relaxed">{data[1].copy}</p>
                                </div>
                                <div className="glass-card rounded-[2rem] p-8 flex-1">
                                    <div className="text-indigo-900 mb-4"><Icon name={data[2].icon} size={24} /></div>
                                    <h3 className="text-xl mb-2">{data[2].title}</h3>
                                    <p className="text-slate-500 text-xs leading-relaxed">{data[2].copy}</p>
                                </div>
                            </div>

                            {/* Small Cards for 4, 5, 6, 7 */}
                            {data.slice(3).map((item, idx) => (
                                <div key={idx} className="md:col-span-3 glass-card rounded-[2rem] p-8">
                                    <div className="text-indigo-900 mb-4"><Icon name={item.icon} size={24} /></div>
                                    <h3 className="text-lg mb-2">{item.title}</h3>
                                    <p className="text-slate-500 text-xs leading-relaxed">{item.copy}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const App = () => {
            const [email, setEmail] = useState('');
            const [submitted, setSubmitted] = useState(false);

            const handleWaitlist = (e) => {
                e.preventDefault();
                if(email.includes('@')) setSubmitted(true);
            };

            return (
                <div className="bg-white min-h-screen">
                    <Navbar />
                    <Hero />
                    
                    {/* Platform Benefits */}
                    <section className="max-w-7xl mx-auto px-6 grid grid-cols-1 md:grid-cols-3 gap-8 mb-24 -mt-10 relative z-20">
                        <div className="bg-white border border-slate-100 p-8 rounded-3xl shadow-xl shadow-slate-200/50 flex items-center gap-5">
                            <div className="text-indigo-900 bg-indigo-50 p-4 rounded-2xl"><Icon name="zap" /></div>
                            <span className="font-bold text-slate-800 tracking-tight">90% Faster DD Cycles</span>
                        </div>
                        <div className="bg-white border border-slate-100 p-8 rounded-3xl shadow-xl shadow-slate-200/50 flex items-center gap-5">
                            <div className="text-indigo-900 bg-indigo-50 p-4 rounded-2xl"><Icon name="database" /></div>
                            <span className="font-bold text-slate-800 tracking-tight">100% Data Coverage</span>
                        </div>
                        <div className="bg-white border border-slate-100 p-8 rounded-3xl shadow-xl shadow-slate-200/50 flex items-center gap-5">
                            <div className="text-indigo-900 bg-indigo-50 p-4 rounded-2xl"><Icon name="shield" /></div>
                            <span className="font-bold text-slate-800 tracking-tight">Live Covenant Tracking</span>
                        </div>
                    </section>

                    <Pillars />

                    {/* VDR Workflow Visual Placeholder */}
                    <section className="py-24 px-6 text-center">
                        <div className="max-w-5xl mx-auto bg-indigo-900 rounded-[3rem] p-16 text-white overflow-hidden relative">
                            <div className="absolute top-0 right-0 w-64 h-64 bg-indigo-500/20 blur-3xl rounded-full"></div>
                            <h2 className="text-4xl mb-8">Raw VDR to IC-Ready Memo</h2>
                            <p className="text-indigo-200 mb-12 max-w-xl mx-auto">Our neural synthesis engine maps unstructured documentation directly to standard financial reporting frameworks.</p>
                            <div className="grid grid-cols-3 gap-4 max-w-2xl mx-auto font-mono text-xs uppercase tracking-tighter opacity-80">
                                <div className="border border-indigo-400/30 p-4 rounded-xl">Ingest</div>
                                <div className="border border-indigo-400/30 p-4 rounded-xl bg-indigo-400/20">Analyze</div>
                                <div className="border border-indigo-400/30 p-4 rounded-xl">Standardize</div>
                            </div>
                        </div>
                    </section>

                    {/* Final CTA / Waitlist */}
                    <section className="py-24 px-6 bg-slate-50 border-t border-slate-200">
                        <div className="max-w-xl mx-auto text-center">
                            <h2 className="text-3xl mb-6">Institutionalize Your Execution.</h2>
                            <p className="text-slate-500 mb-10 font-medium">Join the private beta for project developers and lenders.</p>
                            
                            {!submitted ? (
                                <form onSubmit={handleWaitlist} className="flex flex-col sm:flex-row gap-3">
                                    <input 
                                        type="email" 
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                        placeholder="Enter work email"
                                        className="flex-1 px-6 py-4 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-900 outline-none"
                                        required
                                    />
                                    <button className="bg-indigo-900 text-white px-8 py-4 rounded-xl font-bold hover:bg-indigo-800 transition-colors">
                                        Join Waitlist
                                    </button>
                                </form>
                            ) : (
                                <div className="bg-green-100 text-green-700 p-6 rounded-2xl font-bold flex items-center justify-center gap-3">
                                    <Icon name="check-circle" /> Welcome to Foaklore. We'll be in touch.
                                </div>
                            )}
                        </div>
                    </section>

                    <footer className="py-20 px-6 border-t border-slate-200 bg-white">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start gap-12">
                            <div>
                                <div className="flex items-center gap-2 mb-6">
                                    <div className="w-6 h-6 bg-slate-900 rounded flex items-center justify-center text-white text-[10px] italic">F</div>
                                    <span className="text-xl font-bold tracking-tighter">Foaklore</span>
                                </div>
                                <p className="text-slate-400 text-sm font-semibold italic">Built for the Next Generation of Infrastructure.</p>
                            </div>
                            <div className="grid grid-cols-2 gap-20 text-sm font-bold text-slate-800 uppercase tracking-widest">
                                <div className="flex flex-col gap-4">
                                    <a href="#" className="hover:text-indigo-900">Security</a>
                                    <a href="#" className="hover:text-indigo-900">Privacy</a>
                                </div>
                                <div className="flex flex-col gap-4">
                                    <a href="#" className="hover:text-indigo-900">LinkedIn</a>
                                    <a href="#" className="hover:text-indigo-900">Contact</a>
                                </div>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
